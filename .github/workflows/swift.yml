name: Swift

on:
  push:
    branches: [ "main", "release/*"]
  pull_request:
    branches: [ "main", "release/*" ]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
